name: Ticket Pulse CI

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - deployments/**
      - .github/workflows/ci.yml
  pull_request:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - deployments/**
      - .github/workflows/ci.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Test, Migration & Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: devops_secret
          POSTGRES_DB: tickets_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d tickets_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run database migration
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: devops
          DB_PASSWORD: devops_secret
          DB_NAME: tickets_ci
        run: npm run db:migrate

      - name: Run unit/integration tests with coverage gate
        run: npm run test:coverage

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 7

  frontend-ci:
    name: Frontend Test & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build production assets
        run: npm run build

  docker-verify:
    name: Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image with GHA cache
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ticket-pulse-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify docker compose full stack build
        run: docker compose -f deployments/docker-compose.yml build
